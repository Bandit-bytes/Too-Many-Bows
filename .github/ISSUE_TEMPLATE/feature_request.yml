name: Feature request
description: Suggest a new bow, arrow, ability, config option, or mod compatibility.
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or how would it make the mod more fun?
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft version you play on
      multiple: true
      options:
        - "1.20.1"
        - "1.21.1"
        - "1.21.11"
        - "26.1.2"
        - "26.2"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, references, or related mods.
